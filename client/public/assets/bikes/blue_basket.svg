<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <radialGradient id="blueFrame" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#42A5F5" />
      <stop offset="100%" stop-color="#1565C0" />
    </radialGradient>
  </defs>

  <!-- Rear Luggage Rack -->
  <line x1="28" y1="52" x2="52" y2="52" stroke="#1565C0" stroke-width="3" stroke-linecap="round" />
  <line x1="35" y1="80" x2="32" y2="52" stroke="#1565C0" stroke-width="2.5" />
  <line x1="35" y1="80" x2="48" y2="52" stroke="#1565C0" stroke-width="2.5" />

  <!-- Rear Wheel -->
  <circle cx="35" cy="80" r="28" fill="none" stroke="#212121" stroke-width="6" />
  <circle cx="35" cy="80" r="23" fill="none" stroke="#64B5F6" stroke-width="2" />
  <circle cx="35" cy="80" r="6" fill="#424242" />
  <line x1="35" y1="55" x2="35" y2="105" stroke="#B0BEC5" stroke-width="1.2" />
  <line x1="10" y1="80" x2="60" y2="80" stroke="#B0BEC5" stroke-width="1.2" />
  <line x1="17" y1="62" x2="53" y2="98" stroke="#B0BEC5" stroke-width="1.2" />
  <line x1="17" y1="98" x2="53" y2="62" stroke="#B0BEC5" stroke-width="1.2" />

  <!-- Front Wheel -->
  <circle cx="125" cy="80" r="28" fill="none" stroke="#212121" stroke-width="6" />
  <circle cx="125" cy="80" r="23" fill="none" stroke="#64B5F6" stroke-width="2" />
  <circle cx="125" cy="80" r="6" fill="#424242" />
  <line x1="125" y1="55" x2="125" y2="105" stroke="#B0BEC5" stroke-width="1.2" />
  <line x1="100" y1="80" x2="150" y2="80" stroke="#B0BEC5" stroke-width="1.2" />
  <line x1="107" y1="62" x2="143" y2="98" stroke="#B0BEC5" stroke-width="1.2" />
  <line x1="107" y1="98" x2="143" y2="62" stroke="#B0BEC5" stroke-width="1.2" />

  <!-- Frame - Blue Step-through Dutch style -->
  <path d="M 35 80 L 68 76 L 100 48 L 58 48 Z" fill="none" stroke="url(#blueFrame)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 68 76 Q 85 64 125 80" fill="none" stroke="url(#blueFrame)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="100" y1="48" x2="125" y2="80" stroke="url(#blueFrame)" stroke-width="5" stroke-linecap="round" />

  <!-- Pedals -->
  <circle cx="68" cy="76" r="9" fill="#37474F" stroke="#90A4AE" stroke-width="2" />
  <line x1="62" y1="70" x2="74" y2="82" stroke="#ECEFF1" stroke-width="3" stroke-linecap="round" />

  <!-- Seat Post & Saddle -->
  <line x1="58" y1="48" x2="58" y2="36" stroke="#455A64" stroke-width="4" stroke-linecap="round" />
  <path d="M 48 36 Q 60 32 72 36 Q 66 40 52 40 Z" fill="#424242" stroke="#212121" stroke-width="1.5" />

  <!-- Handlebars -->
  <line x1="100" y1="48" x2="104" y2="28" stroke="url(#blueFrame)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 94 28 L 106 26 L 102 22" fill="none" stroke="#37474F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Front Basket with Yellow Sunflowers -->
  <!-- Wire Basket -->
  <polygon points="108,24 130,24 126,38 112,38" fill="#ECEFF1" stroke="#78909C" stroke-width="1.5" />
  <!-- Basket Grid lines -->
  <line x1="114" y1="24" x2="116" y2="38" stroke="#90A4AE" stroke-width="1" />
  <line x1="120" y1="24" x2="120" y2="38" stroke="#90A4AE" stroke-width="1" />
  <line x1="125" y1="24" x2="123" y2="38" stroke="#90A4AE" stroke-width="1" />
  <line x1="110" y1="31" x2="128" y2="31" stroke="#90A4AE" stroke-width="1" />

  <!-- Sunflowers overflowing -->
  <!-- Left Sunflower -->
  <circle cx="114" cy="21" r="5" fill="#FBC02D" stroke="#F57F17" stroke-width="1" />
  <circle cx="114" cy="21" r="2.5" fill="#5D4037" />
  <!-- Center Sunflower -->
  <circle cx="120" cy="18" r="6" fill="#FFEB3B" stroke="#F57F17" stroke-width="1" />
  <circle cx="120" cy="18" r="3" fill="#4E342E" />
  <!-- Right Sunflower -->
  <circle cx="126" cy="22" r="5" fill="#FBC02D" stroke="#F57F17" stroke-width="1" />
  <circle cx="126" cy="22" r="2.5" fill="#5D4037" />
  <!-- Green leaves -->
  <ellipse cx="110" cy="22" rx="3" ry="1.5" fill="#4CAF50" transform="rotate(-30 110 22)" />
  <ellipse cx="129" cy="20" rx="3" ry="1.5" fill="#4CAF50" transform="rotate(30 129 20)" />
</svg>
