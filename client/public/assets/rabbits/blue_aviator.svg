<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="aviatorJacket" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#42A5F5" />
      <stop offset="100%" stop-color="#1565C0" />
    </radialGradient>
    <radialGradient id="blueFur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BBDEFB" />
      <stop offset="100%" stop-color="#64B5F6" />
    </radialGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF" />
      <stop offset="50%" stop-color="#0091EA" />
      <stop offset="100%" stop-color="#006064" />
    </linearGradient>
  </defs>

  <circle cx="80" cy="80" r="76" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2" />

  <!-- Rabbit Ears -->
  <g transform="rotate(-12 60 40)">
    <path d="M 52 42 C 42 12 56 4 66 22 C 70 32 64 44 52 42 Z" fill="url(#blueFur)" stroke="#1976D2" stroke-width="2.5" />
    <path d="M 54 35 C 47 18 54 12 61 24 C 63 30 60 38 54 35 Z" fill="#90CAF9" />
  </g>
  <g transform="rotate(12 100 40)">
    <path d="M 108 42 C 118 12 104 4 94 22 C 90 32 96 44 108 42 Z" fill="url(#blueFur)" stroke="#1976D2" stroke-width="2.5" />
    <path d="M 106 35 C 113 18 106 12 99 24 C 97 30 100 38 106 35 Z" fill="#90CAF9" />
  </g>

  <!-- Aviator Leather Cap & Straps -->
  <path d="M 46 64 C 44 38 116 38 114 64 C 114 74 118 90 114 96 C 110 88 104 82 102 78 C 96 82 64 82 58 78 C 56 82 50 88 46 96 C 42 90 46 74 46 64 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2" />
  <!-- Earflaps dangling down -->
  <path d="M 46 75 L 43 96 Q 48 98 52 92 L 52 76 Z" fill="#4E342E" stroke="#3E2723" stroke-width="1.5" />
  <path d="M 114 75 L 117 96 Q 112 98 108 92 L 108 76 Z" fill="#4E342E" stroke="#3E2723" stroke-width="1.5" />

  <!-- Pilot Goggles on Forehead -->
  <!-- Strap -->
  <path d="M 46 54 Q 80 50 114 54" stroke="#2E1C0C" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- Left Lens -->
  <rect x="52" y="44" width="24" height="20" rx="6" fill="url(#lensGrad)" stroke="#BDBDBD" stroke-width="3" />
  <line x1="56" y1="47" x2="68" y2="47" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <!-- Right Lens -->
  <rect x="84" y="44" width="24" height="20" rx="6" fill="url(#lensGrad)" stroke="#BDBDBD" stroke-width="3" />
  <line x1="88" y1="47" x2="100" y2="47" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <!-- Bridge -->
  <rect x="76" y="51" width="8" height="6" rx="2" fill="#757575" />

  <!-- Rabbit Face -->
  <ellipse cx="80" cy="80" rx="28" ry="24" fill="url(#blueFur)" stroke="#1976D2" stroke-width="2" />

  <!-- White Muzzle -->
  <ellipse cx="80" cy="88" rx="16" ry="11" fill="#FFFFFF" />
  <ellipse cx="64" cy="86" rx="4" ry="2.5" fill="#FF8A80" opacity="0.6" />
  <ellipse cx="96" cy="86" rx="4" ry="2.5" fill="#FF8A80" opacity="0.6" />

  <!-- Eyes -->
  <ellipse cx="71" cy="76" rx="4.5" ry="5.5" fill="#1A237E" />
  <circle cx="69.5" cy="74" r="2" fill="#FFFFFF" />
  <ellipse cx="89" cy="76" rx="4.5" ry="5.5" fill="#1A237E" />
  <circle cx="87.5" cy="74" r="2" fill="#FFFFFF" />

  <!-- Nose & Smile -->
  <polygon points="80,84 76,80 84,80" fill="#E91E63" />
  <path d="M 76 87 Q 80 91 84 87" stroke="#1A237E" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Blue Shearling Aviator Jacket -->
  <path d="M 45 106 C 40 120 40 148 40 155 L 120 155 C 120 148 120 120 115 106 C 102 112 58 112 45 106 Z" fill="url(#aviatorJacket)" stroke="#0D47A1" stroke-width="3" />
  <!-- Fluffy White Shearling Collar -->
  <path d="M 48 106 Q 80 122 112 106 Q 100 128 80 124 Q 60 128 48 106 Z" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="2" />
  <line x1="80" y1="124" x2="80" y2="155" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4,2" />
</svg>
