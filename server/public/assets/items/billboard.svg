<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="100%" stop-color="#FFF176" />
    </linearGradient>
    <filter id="boardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Wooden Posts stuck in ground -->
  <rect x="36" y="60" width="8" height="58" rx="2" fill="#5D4037" stroke="#3E2723" stroke-width="1.5" />
  <rect x="116" y="60" width="8" height="58" rx="2" fill="#5D4037" stroke="#3E2723" stroke-width="1.5" />

  <!-- Support Braces -->
  <line x1="44" y1="90" x2="60" y2="115" stroke="#4E342E" stroke-width="3" />
  <line x1="116" y1="90" x2="100" y2="115" stroke="#4E342E" stroke-width="3" />

  <!-- Main Signboard -->
  <g filter="url(#boardDrop)">
    <!-- Wooden Outer Border -->
    <rect x="10" y="8" width="140" height="66" rx="6" fill="#6D4C41" stroke="#3E2723" stroke-width="2.5" />
    <!-- Sign Inner Board -->
    <rect x="16" y="14" width="128" height="54" rx="4" fill="url(#boardGrad)" stroke="#FBC02D" stroke-width="2" />

    <!-- Top Sponsor Banner Tag -->
    <rect x="30" y="18" width="100" height="14" rx="3" fill="#2E7D32" />
    <text x="80" y="28" font-family="'Fredoka', sans-serif" font-weight="700" font-size="8" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SPONSOR BONUS</text>

    <!-- Ad Message -->
    <text x="80" y="44" font-family="'Fredoka', sans-serif" font-weight="700" font-size="13" fill="#E65100" text-anchor="middle">RABBIT FUEL ⚡</text>
    <text x="80" y="58" font-family="'Fredoka', sans-serif" font-weight="600" font-size="9" fill="#1B5E20" text-anchor="middle">WATCH &amp; EARN +100 ₦</text>

    <!-- Little carrot icon left & right -->
    <polygon points="22,35 25,43 28,35" fill="#FF7043" />
    <polygon points="132,35 135,43 138,35" fill="#FF7043" />
  </g>
</svg>
