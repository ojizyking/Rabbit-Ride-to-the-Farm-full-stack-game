<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <radialGradient id="carrotBody" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="60%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#E64A19" />
    </radialGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="rotate(35 30 30)" filter="url(#cShadow)">
    <!-- Green Tops -->
    <path d="M 30 18 C 26 8 18 10 24 16 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5" />
    <path d="M 30 18 C 30 6 36 6 32 16 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5" />
    <path d="M 30 18 C 34 8 42 10 36 16 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5" />

    <!-- Carrot Root -->
    <path d="M 23 18 C 22 17 38 17 37 18 C 35 30 32 48 30 54 C 28 48 25 30 23 18 Z" fill="url(#carrotBody)" stroke="#BF360C" stroke-width="2" stroke-linejoin="round" />

    <!-- Ridges -->
    <path d="M 26 26 Q 30 28 33 25" stroke="#D84315" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 27 34 Q 30 36 33 33" stroke="#D84315" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 28 42 Q 30 43 32 41" stroke="#D84315" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Glow/shine -->
    <ellipse cx="27" cy="22" rx="2" ry="5" fill="#FFE0B2" opacity="0.6" transform="rotate(-10 27 22)" />
  </g>
</svg>
