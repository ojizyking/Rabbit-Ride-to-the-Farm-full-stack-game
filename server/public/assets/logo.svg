<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="badgeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#216D3C" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Green Circular Badge -->
  <circle cx="60" cy="60" r="54" fill="url(#badgeGrad)" stroke="#FFC93C" stroke-width="4" filter="url(#shadow)" />
  <circle cx="60" cy="60" r="49" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="3,3" stroke-width="1.5" />

  <!-- Road / ground arc in badge -->
  <path d="M 12 76 Q 60 92 108 76" stroke="#174D2A" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Bicycle Wheels (Yellow rims, dark tires) -->
  <circle cx="36" cy="76" r="14" fill="#2E2E2E" stroke="#FFC93C" stroke-width="2.5" />
  <circle cx="36" cy="76" r="7" fill="#174D2A" />
  <circle cx="84" cy="76" r="14" fill="#2E2E2E" stroke="#FFC93C" stroke-width="2.5" />
  <circle cx="84" cy="76" r="7" fill="#174D2A" />

  <!-- Bike Frame (Yellow #FFC93C) -->
  <path d="M 36 76 L 54 74 L 68 58 L 48 58 Z" fill="none" stroke="#FFC93C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 54 74 L 84 76" stroke="#FFC93C" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 68 58 L 84 76" stroke="#FFC93C" stroke-width="3" stroke-linecap="round" />
  <path d="M 48 58 L 48 52" stroke="#FFC93C" stroke-width="3" stroke-linecap="round" />
  <!-- Seat -->
  <path d="M 42 52 Q 48 50 56 52" stroke="#4A2E12" stroke-width="4" stroke-linecap="round" />
  <!-- Handlebars -->
  <path d="M 68 58 L 74 48 L 70 48" fill="none" stroke="#FFC93C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="69" cy="48" r="2" fill="#E65100" />

  <!-- White Rabbit Rider -->
  <!-- Ears -->
  <path d="M 54 20 C 51 10 57 8 60 18 Z" fill="#FFFFFF" stroke="#333" stroke-width="1.5" />
  <path d="M 56 18 C 54 13 57 12 59 18 Z" fill="#FF80AB" />
  <path d="M 62 18 C 65 8 72 10 67 21 Z" fill="#FFFFFF" stroke="#333" stroke-width="1.5" />
  <path d="M 64 18 C 66 12 70 13 67 20 Z" fill="#FF80AB" />

  <!-- Rabbit Head -->
  <ellipse cx="61" cy="30" rx="12" ry="10" fill="#FFFFFF" stroke="#333" stroke-width="1.5" />
  <!-- Cheeks blush -->
  <ellipse cx="53" cy="32" rx="2.5" ry="1.5" fill="#FF8A80" opacity="0.6" />
  <ellipse cx="69" cy="32" rx="2.5" ry="1.5" fill="#FF8A80" opacity="0.6" />
  <!-- Eyes -->
  <ellipse cx="56" cy="28" rx="1.8" ry="2.2" fill="#222" />
  <circle cx="55.5" cy="27" r="0.7" fill="#FFF" />
  <ellipse cx="66" cy="28" rx="1.8" ry="2.2" fill="#222" />
  <circle cx="65.5" cy="27" r="0.7" fill="#FFF" />
  <!-- Nose & Smile -->
  <polygon points="61,31 59.5,29.5 62.5,29.5" fill="#FF5252" />
  <path d="M 59 32 Q 61 34 63 32" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round" />

  <!-- Green Helmet -->
  <path d="M 50 28 C 49 19 72 19 72 28 C 72 29 50 29 50 28 Z" fill="#2D8A4E" stroke="#1B5E20" stroke-width="1.5" />
  <circle cx="61" cy="22" r="2" fill="#FFC93C" />

  <!-- Rabbit Body & Arms holding handlebars -->
  <path d="M 55 38 C 50 42 54 54 62 54 C 68 54 70 42 66 38 Z" fill="#FFFFFF" stroke="#333" stroke-width="1.5" />
  <!-- Orange scarf/shirt -->
  <path d="M 55 38 Q 61 41 66 38 Q 68 44 61 46 Q 54 44 55 38 Z" fill="#FF7A00" />
  <!-- Arm -->
  <path d="M 64 42 Q 70 44 71 48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 64 42 Q 70 44 71 48" stroke="#333" stroke-width="0.8" fill="none" />

  <!-- Little front carrot basket -->
  <path d="M 72 49 L 81 50 L 78 57 L 73 56 Z" fill="#B26A00" stroke="#5D4037" stroke-width="1" />
  <polygon points="76,46 74,52 79,48" fill="#FF7A00" />
  <path d="M 77 45 L 79 43" stroke="#2E7D32" stroke-width="1.5" />
</svg>
